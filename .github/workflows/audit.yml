name: Live SEO and Canonical Audit

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Live SEO Audit
        run: |
          python live_seo_audit.py \
            https://dolatrammpi-coder.github.io/Quiz/

      - name: Upload SEO Reports
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-audit-reports
          path: live_seo_reports/
          if-no-files-found: error
          retention-days: 30

      - name: Commit and Push SEO Reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add live_seo_reports/

          if git diff --cached --quiet; then
            echo "No SEO report changes to commit."
          else
            git commit -m "Update live SEO audit reports"
            git push origin main
          fi
